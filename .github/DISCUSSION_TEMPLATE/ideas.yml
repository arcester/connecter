title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Search first: if someone already suggested it, add your 👍 and a comment there instead.
        You can write in English or Spanish.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us about your setup and what is hard or annoying today.
      placeholder: "I use two Macs and I have to add the same shares on both…"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like Connecter to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
